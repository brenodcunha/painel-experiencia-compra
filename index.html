<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e6eef5">
<title>Experiência de Compra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b1220'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3C/svg%3E">
<style>
/* ---------- tokens ----------
   Paleta de status e sequencial: instancia de referencia da skill dataviz,
   validada pelo scripts/validate_palette.js (modo claro, superficie #ffffff).
   Texto NUNCA veste a cor da serie: valores e rotulos usam --ink/--ink-2/--muted,
   e a identidade vem de um ponto colorido ao lado (mark), ou de um tom claro de
   fundo com tinta escura da mesma familia (contraste >= 4.5:1 conferido). */
:root{
  color-scheme:light;
  --page:#e6eef5; --bezel:#ffffff; --surface:#ffffff; --surface-2:#f3f7fb;
  --hair:#e2e8ef; --hair-2:#cfd8e3;
  --ink:#0b1220; --ink-2:#4b5563; --muted:#5f6b7a;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-tint:#e4effb;
  --good:#0ca30c;  --good-ink:#006300;   --good-tint:#e3f5e3;
  --warn:#fab219;  --warn-ink:#8a5a00;   --warn-tint:#fff1cc;
  --ser:#ec835a;   --ser-ink:#9a3412;    --ser-tint:#fde6dc;
  --crit:#d03b3b;  --crit-ink:#b91c1c;   --crit-tint:#fbe0e0;
  --neu-ink:#4b5563; --neu-tint:#eef2f6;
  /* familia so da coluna Situacao — seis chapas, todas cheias com texto branco.
     Medido nas oito: pior par interno dE 13,6 (petroleo x cinza, os dois mais
     antigos) e pior contra a familia da Taxa dE 15,7; todas passam de 4,5:1
     com o texto branco. Nenhum caso divide chapa com outro. */
  --calma:#64748b; --pausa:#115e59;
  --punido:#720022; --semnota:#a4007e; --decola:#854a00;
  --r-lg:26px; --r:14px; --r-sm:8px;
  --dur:160ms; --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 18px 50px rgba(11,18,32,.10), 0 2px 6px rgba(11,18,32,.05);
}
*{box-sizing:border-box}
html{background:var(--page)}
body{
  margin:0;color:var(--ink);
  font:15.5px/1.55 system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  /* aneis concentricos da referencia: estatico, sem animacao */
  background:
    repeating-radial-gradient(circle at 62% 12%, rgba(42,120,214,.075) 0 1px, transparent 1px 86px),
    radial-gradient(1200px 700px at 62% 12%, #eef4fa 0%, var(--page) 60%);
  min-height:100vh;
}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .sm{font-size:13.5px}
code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- moldura branca (bezel) ---------- */
.frame{max-width:1560px;margin:18px auto 60px;background:var(--bezel);border-radius:var(--r-lg);
  padding:6px;box-shadow:var(--shadow);overflow:hidden}
@media(max-width:700px){
  .frame{margin:8px;border-radius:18px;padding:4px}
  .hero{padding:16px 14px 44px;clip-path:polygon(0 0,100% 0,100% 100%,64px 100%,0 calc(100% - 34px))}
  .top{gap:10px}
  main{padding:14px 12px 30px}
}

/* ---------- faixa-heroi: degrade cinza -> ciano, canto chanfrado ---------- */
/* Canto chanfrado da referencia. Em PX, nao em %: com % o corte crescia junto
   com a altura do heroi e comia o rodape — mediu-se 53px de corte engolindo
   60px do texto de progresso. Em px ele e previsivel, e o padding-bottom (52px)
   e sempre maior que a altura do corte (46px), entao nada de conteudo entra nele. */
.hero{position:relative;border-radius:calc(var(--r-lg) - 6px) calc(var(--r-lg) - 6px) 0 0;
  padding:22px 26px 62px;color:var(--ink);
  background:linear-gradient(112deg,#b1b6bb 0%,#a9c1d2 34%,#6fb0dc 68%,#3b97d3 100%);
  clip-path:polygon(0 0,100% 0,100% 100%,92px 100%,0 calc(100% - 46px))}
.hero:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(560px 300px at 68% 40%, rgba(255,255,255,.35), transparent 70%)}
.hero>*{position:relative}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:clamp(21px,1.8vw,26px);margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand .sub{font-size:13.5px;color:var(--ink);font-weight:400;margin-top:3px}
.brand .sub b{color:var(--ink);font-weight:600}
.spacer{flex:1}

[hidden]{display:none!important}   /* senao o display do .pill vence o atributo */

/* pilulas de acao */
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:99px;padding:10px 18px;
  border:1px solid transparent;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease),
    box-shadow var(--dur) var(--ease)}
.pill:hover{transform:translateY(-1px)} .pill:active{transform:scale(.98)}
.pill.dark{background:var(--ink);color:#fff}
.pill.dark:hover{background:#1c2536}
.pill.dark .arr{display:inline-block;transition:transform var(--dur) var(--ease)}
.pill.dark:hover .arr{transform:translateX(3px)}
.pill.light{background:#fff;color:var(--ink);padding:5px 12px 5px 5px}
.pill.light:hover{box-shadow:0 4px 14px rgba(11,18,32,.14)}
.pill[disabled]{opacity:.7;cursor:progress;transform:none}
.eu img,.eu .ini{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--surface-2);border:1px solid var(--hair)}
.eu .ini{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.eu .qn{line-height:1.2;text-align:left}
.eu .qn b{display:block;font-size:14px}
.eu .qn span{font-size:12px;color:var(--muted);font-weight:400}
.eu .cv{font-style:normal;font-size:10px;color:var(--muted);transition:transform var(--dur) var(--ease)}
.eu[aria-expanded="true"] .cv{transform:rotate(180deg)}
.euw{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--hair);
  border-radius:12px;min-width:200px;padding:5px;z-index:40;box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;background:0;border:0;font-size:14px;
  padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--crit-ink)}
.menu button:hover{background:var(--crit-tint)}

/* KPIs em vidro: 1 heroi + tiles. Sao TAMBEM o filtro da tabela — nao existe
   um segundo controle repetindo os mesmos quatro recortes. */
.kpis{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px;margin-top:22px}
@media(max-width:1280px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.tile{background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.9);border-radius:18px;
  padding:16px 18px;text-align:left;cursor:pointer;color:var(--ink);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(11,18,32,.12);background:rgba(255,255,255,.92)}
.tile:active{transform:scale(.99)}
.tile[aria-pressed="true"]{background:#fff;border-color:var(--ink);
  box-shadow:0 0 0 2px var(--ink), 0 10px 26px rgba(11,18,32,.14)}
.tile .sel{display:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);margin-left:auto}
.tile[aria-pressed="true"] .sel{display:inline}
.tile .lab{font-size:13.5px;color:var(--ink-2);margin-bottom:6px;display:flex;align-items:center;
  min-height:16px}
.tile .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.tile .dl{font-size:13px;color:var(--ink-2);margin-top:6px}
.tile.hero-tile .val{font-size:clamp(46px,4.4vw,62px);letter-spacing:-.035em}
.tile.hero-tile .lab{font-size:14.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1.5px rgba(11,18,32,.30)}   /* borda escura: o amarelo nao some no branco */
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)}
.dot.ser{background:var(--ser)} .dot.crit{background:var(--crit)}
.dot.acc{background:var(--accent)} .dot.neu{background:#9aa5b1}
.ml b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:5px}
.ml .h{font-weight:700;color:var(--ink)}

/* ---------- conteudo ---------- */
main{background:var(--surface);border-radius:0 0 calc(var(--r-lg) - 6px) calc(var(--r-lg) - 6px);
  padding:20px 22px 40px;transition:opacity var(--dur) var(--ease)}
main.carregando{opacity:.55;pointer-events:none}
/* fica no canto superior esquerdo, junto da marca — longe do corte */
.status{font-size:13.5px;color:var(--ink);font-weight:600;min-height:1.1em;margin-top:2px}
.status.falha{color:var(--crit-ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
input[type=search]{background:var(--surface-2);border:1px solid var(--hair);color:var(--ink);
  border-radius:99px;padding:10px 16px;font:inherit;font-size:14.5px;width:280px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
input[type=search]:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
/* legenda: dois blocos com titulo proprio, nao uma fileira embolada */
.leg{display:grid;grid-template-columns:auto auto 1fr;gap:14px 28px;margin:0 0 12px;
  border:1px solid var(--hair);border-radius:var(--r);padding:13px 16px;background:var(--surface-2)}
@media(max-width:1180px){.leg{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.leg{grid-template-columns:1fr}}
.lg{min-width:0}
.lg+.lg{border-left:1px solid var(--hair-2);padding-left:28px}
@media(max-width:1180px){.lg:nth-child(3){border-left:0;padding-left:0;
  border-top:1px solid var(--hair-2);padding-top:12px;grid-column:1/-1}}
@media(max-width:860px){.lg+.lg{border-left:0;padding-left:0;
  border-top:1px solid var(--hair-2);padding-top:12px}}
.lt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:9px}
.lt span{text-transform:none;letter-spacing:0;font-weight:400}
.lr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.lr+.lr{margin-top:7px}
.lr em{font-style:normal}
.lr .ct2{margin-left:auto;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}

/* barra de explicacao (vista de categorias) */
.info{border:1px solid var(--hair);border-radius:var(--r);padding:13px 16px;margin:0 0 12px;
  background:var(--surface-2);font-size:14px;color:var(--ink-2);line-height:1.65}
.info div+div{margin-top:5px}
.info b{color:var(--ink)}

/* conta limpa: a tabela de categorias nao pode ficar em branco */
.vazio{border:1px solid var(--hair);border-radius:var(--r);background:var(--surface);
  padding:44px 26px;text-align:center}
.vazio .ei{width:46px;height:46px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--good-tint);color:var(--good-ink);font-size:22px;font-weight:700}
.vazio .ei.ruim{background:var(--crit-tint);color:var(--crit-ink)}
.vazio ul.falhas{display:inline-block;text-align:left;margin:12px auto 8px;padding-left:20px;
  color:var(--crit-ink);font-size:14px;line-height:1.6;max-width:72ch}
.vazio h2{font-size:19px;margin:0 0 7px}
.vazio p{margin:0 auto;max-width:56ch;color:var(--ink-2);font-size:14.5px;line-height:1.65}

/* legenda dos destinos: o selo DE VERDADE + o que ele quer dizer */
/* uma so grade para as tres linhas: os selos tem larguras diferentes e os textos
   precisam comecar todos na mesma coluna, senao a legenda fica esfarrapada */
.defs{display:grid;grid-template-columns:auto 1fr;gap:13px 16px;align-items:start;
  margin-top:12px;padding-top:13px;border-top:1px solid var(--hair-2)}
.defs:first-child{margin-top:0;padding-top:0;border-top:0}
.defs .d{display:contents}
.defs .d>.tag{justify-self:start;margin-top:1px}
@media(max-width:760px){.defs{grid-template-columns:1fr;gap:6px}
  .defs .d+.d>.tag{margin-top:11px}}

.box{border:1px solid var(--hair);border-radius:var(--r);overflow:auto;background:var(--surface)}  /* tabela larga rola AQUI dentro, nunca a pagina */
table{width:100%;border-collapse:collapse;font-size:14.5px}
caption{text-align:left;padding:0 0 8px;font-size:13.5px;color:var(--muted)}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;padding:12px 14px;background:var(--surface-2);white-space:nowrap;
  position:sticky;top:0;z-index:5;border-bottom:1px solid var(--hair)}
td{padding:11px 14px;border-top:1px solid var(--hair);vertical-align:middle}
tr.ln{cursor:pointer;scroll-margin-top:60px;transition:background-color var(--dur) var(--ease);
  content-visibility:auto;contain-intrinsic-size:auto 58px}  /* 409 linhas sem travar */
tr.ln:hover td,tr.ln.ab td{background:var(--surface-2)}
.exp{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);background:#fff;
  color:var(--muted);font-size:13.5px;cursor:pointer;flex:none;
  transition:transform var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.exp:hover{border-color:var(--accent);color:var(--accent-ink)}
.exp[aria-expanded="true"]{transform:rotate(90deg);border-color:var(--accent);color:var(--accent-ink)}
.it{display:flex;gap:10px;align-items:center;min-width:0}
.it .tt{min-width:0}
.thumb{width:36px;height:36px;object-fit:cover;border-radius:8px;background:var(--surface-2);flex:none;
  border:1px solid var(--hair)}
.it b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}

/* etiquetas: tom claro + tinta escura + ponto (a cor nunca vai no texto) */
.b,.tag{display:inline-flex;align-items:center;gap:7px;border-radius:99px;white-space:nowrap;
  font-weight:600;line-height:1}
.b{padding:5px 10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.tag{padding:5px 10px;font-size:12.5px}
.tag.plain:before{display:none}   /* etiqueta informativa, nao e status: sem ponto */
.b:before,.tag:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.good{background:var(--good-tint);color:var(--good-ink)}
.warn{background:var(--warn-tint);color:var(--warn-ink)}
.ser{background:var(--ser-tint);color:var(--ser-ink)}
.crit{background:var(--crit-tint);color:var(--crit-ink)}
.acc{background:var(--accent-tint);color:var(--accent-ink)}
.neu{background:var(--neu-tint);color:var(--neu-ink)}
.n100,.n75{background:var(--good-tint);color:var(--good-ink)}
.n65,.n50{background:var(--ser-tint);color:var(--ser-ink)}   /* mesma faixa laranja "Media" */
.n30{background:var(--crit-tint);color:var(--crit-ink)}
.ncinza{background:var(--neu-tint);color:var(--neu-ink)}
.tx{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}

/* SITUACAO: chapa cheia com texto branco, em FAMILIA DE COR PROPRIA.
   Verde/amarelo/vermelho estao reservados para a TAXA, e a nota usa as cores
   do proprio ML — se a situacao repetisse esses tons, tres significados
   diferentes dividiriam a mesma paleta na mesma linha.
   Aqui: escuro = doi agora · violeta = esperando o ML · ardosia = nada a fazer.
   Medido: separacao CVD entre as tres DeltaE 17,0 e contra a escala da taxa 17,9
   (alvo 8). Branco sobre cada chapa: 18,7:1 · 8,6:1 · 4,8:1. */
.st{display:inline-flex;align-items:center;border-radius:8px;padding:5px 11px;font-size:12.5px;
  font-weight:600;white-space:nowrap;--st:var(--calma);background:var(--st);color:#fff}
.st.forte{--st:var(--ink)}
.st.pausa{--st:var(--pausa)}     /* parado, e repor nao pune */
.st.punido{--st:var(--punido)}   /* parado, mas a punicao volta ao repor */
.st.semnota{--st:var(--semnota)} /* o ML ainda nao calculou nota nenhuma */
.st.decola{--st:var(--decola)}   /* no Decola: a punicao fica anulada */

/* ---------- detalhe expandido: 3 colunas numeradas, filete no topo ---------- */
td.det{padding:0;background:#f8fafc}
.dg{display:grid;grid-template-columns:1fr 1.15fr 1fr;border-top:2px solid var(--ink)}
@media(max-width:1000px){.dg{grid-template-columns:1fr}}
.dbx{padding:16px 18px 18px;border-left:1px solid var(--hair);min-width:0;position:relative}
.dbx:first-child{border-left:0}
.dt{display:flex;align-items:baseline;gap:9px;font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.dt .n{font-size:12.5px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.eq2{font-size:21.5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:2px 0 6px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.eq2 b{font-weight:700}.eq2 span{color:var(--muted);font-size:14.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid var(--hair);color:var(--ink-2);background:#fff}
.ch.on{border-color:var(--crit);color:var(--crit-ink);background:var(--crit-tint)}
.ch i{font-style:normal;color:var(--muted);font-size:12px;margin-left:3px}
.pj{display:flex;gap:5px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.pj span{background:#fff;border:1px solid var(--hair);border-radius:7px;padding:3px 8px}
.pj i{font-style:normal;color:var(--muted);margin-right:4px}
.fala{font-size:15px;line-height:1.5;margin-bottom:8px;padding:10px 12px;border-radius:10px;
  background:#fff;border:1px solid var(--hair)}
.acao{margin-top:12px;font-size:14.5px;line-height:1.5;padding:10px 12px;border-radius:10px;border:1px solid}
.acao.good{background:var(--good-tint);border-color:#bfe6bf;color:var(--ink)}
.acao.warn{background:var(--warn-tint);border-color:#f0d58a;color:var(--ink)}
.acao.crit{background:var(--crit-tint);border-color:#f2bcbc;color:var(--ink)}
.acao.acc{background:var(--accent-tint);border-color:#bcd5f5;color:var(--ink)}
.ri{font-size:14px;padding:4px 0 4px 16px;position:relative;color:var(--ink)}
.ri:before{content:"›";position:absolute;left:3px;color:var(--accent-ink);font-weight:700}
.rl{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--hair)}
.rl .lk2{font-size:12.5px;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.rl .lk2:hover{text-decoration:underline}
.rl .prod{color:var(--ink-2);text-decoration:none}
.rl .prod:hover{text-decoration:underline}
.rl:first-of-type{border-top:0}
.rl b{font-weight:600} .rl .muted{font-size:12.5px;display:block}
.lk{display:inline-block;margin-top:10px;font-size:14px;font-weight:600}
.pode{margin-top:10px}

.vazio{color:var(--muted);text-align:center;padding:36px}
.cab{display:flex;gap:10px;align-items:baseline;margin:28px 0 10px}
.cab h2{font-size:14.5px;margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cab span{font-size:13.5px;color:var(--muted)}
.ct td{vertical-align:top}
.ct .nm{font-weight:600}
.ct .cm{font-size:12.5px;color:var(--muted);display:block;line-height:1.45;margin:2px 0 4px}
.gem{display:grid;gap:10px}
.gem .g{border-left:2px solid var(--accent);padding:1px 0 1px 10px}
.gem .g b{font-weight:600;font-size:13.5px}
.gem .cam{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
.gem .cam .fim{color:var(--ink-2);font-weight:600}
.ct .cm .fim{color:var(--ink-2);font-weight:600}
/* a barra vai para a linha DE BAIXO, encostada a direita: assim o numero fica
   debaixo do cabecalho, como manda uma coluna numerica alinhada a direita.
   Inline, ela empurrava o valor 98px para dentro. */
.bar3{height:5px;border-radius:99px;width:80px;overflow:hidden;display:block;margin:7px 0 0 auto}
.bar3 i{display:block;height:100%;border-radius:0 99px 99px 0}
.bar3.good{background:var(--good-tint)} .bar3.good i{background:var(--good)}
.bar3.warn{background:var(--warn-tint)} .bar3.warn i{background:var(--warn)}
.bar3.crit{background:var(--crit-tint)} .bar3.crit i{background:var(--crit)}
.bar3.neu{background:var(--neu-tint)}

/* ---------- login ---------- */
/* guia de telas do DevCenter: abre por cima de tudo e rola sozinho */
.gd{position:fixed;inset:0;z-index:60;background:rgba(11,18,32,.55);
  display:grid;place-items:start center;overflow:auto;padding:0 16px 60px}
.gd[hidden]{display:none!important}
.gdx{background:var(--surface);border-radius:var(--r);max-width:920px;width:100%;margin:26px 0 0;
  box-shadow:0 30px 80px rgba(11,18,32,.3)}
.gdt{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--hair);
  border-radius:var(--r) var(--r) 0 0;padding:18px 24px;display:flex;align-items:center;gap:14px}
.gdt h2{font-size:20px;margin:0;letter-spacing:-.02em;flex:1;min-width:0}
.gdt .sb{display:block;font-size:13.5px;font-weight:400;color:var(--ink-2);margin-top:3px}
.gdf{border:1px solid var(--hair);background:#fff;width:36px;height:36px;border-radius:50%;
  font-size:17px;color:var(--ink-2);cursor:pointer;flex:none}
.gdf:hover{border-color:var(--accent);color:var(--accent-ink)}
.gdc{padding:6px 24px 30px}
/* Cada passo tem 760 a 1300px de altura por causa do print. Sem uma ancora o
   leitor rola e perde de vista em qual passo esta — por isso o titulo GRUDA
   embaixo do cabecalho, e cada passo comeca com um risco que separa de verdade. */
.gp{padding:0 0 32px}
.gp+.gp:before{content:"";display:block;height:1px;background:var(--hair);margin:0 0 4px}
.gp .cab{position:sticky;top:92px;z-index:1;background:var(--surface);
  margin:0 -24px;padding:15px 24px 13px;
  display:flex;gap:13px;align-items:baseline;box-shadow:0 1px 0 var(--hair)}
.gp .nm2{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;flex:none}
.gp h3{font-size:17.5px;margin:0 0 2px;letter-spacing:-.01em}
.gp p{color:var(--ink-2);font-size:14.5px;line-height:1.65;margin:14px 0 0}
.gp p b{color:var(--ink)}
.gp code{background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--ink);font-size:13.5px}
.gp img{display:block;width:100%;margin:14px 0 0;border:1px solid var(--hair);border-radius:10px}
.gp .trava{display:flex;gap:11px;margin:12px 0 0;padding:12px 14px;border-radius:10px;
  background:var(--warn-tint);color:var(--warn-ink);font-size:14px;line-height:1.6}
.gp .trava b{color:var(--warn-ink)}
.gp .trava .ic2{font-weight:700;flex:none}
.gp ul{margin:9px 0 0;padding-left:20px;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.gp ul b{color:var(--ink)}
.gp .baixa{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent-ink);font-weight:600}

.setup{max-width:660px;margin:30px auto 20px}
.setup h2{font-size:24.5px;margin:0 0 6px;letter-spacing:-.02em}
.setup .sub2{color:var(--ink-2);font-size:15px;margin-bottom:22px;line-height:1.55}
.passo2{background:#fff;border:1px solid var(--hair);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;
  transition:opacity var(--dur) var(--ease)}
.passo2.off{opacity:.45;pointer-events:none}
/* FEITO: o passo ja cumprido sai do caminho, mas continua legível e destravável
   pelo botão "alterar" — diferente de .off, que é "ainda não chegou a vez". */
.passo2.feito{background:var(--surface-2);border-style:dashed}
.passo2.feito .campo,.passo2.feito .ajuda{opacity:.45;pointer-events:none}
.passo2.feito h3,.passo2.feito .n2{opacity:.55}
.reabrir{float:right;margin-top:-2px;background:transparent;border:0;cursor:pointer;
  font:inherit;font-size:13px;font-weight:600;color:var(--good-ink)}
.reabrir:hover{text-decoration:underline}
.passo2 .n2{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-right:10px;font-variant-numeric:tabular-nums}
.passo2 h3{display:inline;font-size:17px;margin:0}
.passo2 .ajuda{color:var(--ink-2);font-size:14.5px;line-height:1.6;margin:10px 0 0}
.passo2 .ajuda code{background:var(--surface-2);padding:1px 6px;border-radius:5px;color:var(--ink)}
.campo{margin:10px 0 0}
.campo label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.campo input{width:100%;background:var(--surface-2);border:1px solid var(--hair);color:var(--ink);
  border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.vermais{display:block;margin-top:8px;background:transparent;border:0;padding:4px 0;
  font:inherit;font-size:13px;font-weight:600;color:var(--accent-ink);cursor:pointer;text-align:left}
.vermais:hover{text-decoration:underline}
.vermais:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.onde{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent-ink);
  font-weight:600;text-decoration:none}
.onde:hover{text-decoration:underline}
.onde.morto{color:var(--muted);font-weight:400;pointer-events:none}
.dica{display:block;margin-top:3px;font-size:12.5px;color:var(--muted);line-height:1.5}
.dica b{color:var(--ink-2)}

.campo input:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.erro{color:var(--crit-ink);font-size:14px;margin-top:10px}
.okz{color:var(--good-ink);font-size:14px;margin-top:10px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>

<body>
<div class="frame">
  <header class="hero">
    <div class="top">
      <div class="brand"><h1>Experiência de Compra</h1><div class="sub" id="sub"></div>
        <div class="status" id="status" role="status" aria-live="polite"></div></div>
      <div class="spacer"></div>
      <button type="button" class="pill dark" id="bguia" data-guia hidden></button>
      <button type="button" class="pill dark" id="att" hidden></button>
      <div class="euw" id="eu"></div>
    </div>
    <div id="kpis"></div>
  </header>
  <main id="app"><div class="vazio">Carregando…</div></main>
</div>

<script>
const $=s=>document.querySelector(s);
// memoria desta aba (sessionStorage pode nao existir: modo privado etc.) — nunca quebra a tela
const lembra=(k,v)=>{ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v); }catch(e){ return null; } };
let D=null, filtro='todos', busca='', aberto=null;
const VERSAO_DADOS=7;   // formato do dados.json que esta tela desenha = regras.VERSAO (o empacotador confere)
// constantes da regra: vem do dados.json (fonte unica: regras.py); o fallback e so
// para nao quebrar num dado sem o campo
const R=()=>Object.assign({LIM_ITEM:100,LIM_CAT:200,JANELA:365,JANELA_RAPIDA:60,JANELA_ANTIGA:180,PESO:60},(D&&D.regras)||{});
// TEXTOS FIXOS: nunca escritos aqui. Vem de regras.ROTULOS (via dados.json e /api/conta).
// Chave que nao existe aparece como [chave] — quebra visivel, nunca palavra inventada.
let C_ROTULOS=null;
const T=k=>{const r=(D&&D.rotulos)||C_ROTULOS||{}; return r[k]!==undefined?r[k]:'['+k+']';};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nb=v=>(v==null||v===-1)?'ncinza':'n'+v;
const nt=v=>(v==null||v===-1)?'cinza':v;
const pc=v=>v==null?'—':(v>0&&v<0.01?'<0,01':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}))+'%';
const mil=n=>(n||0).toLocaleString('pt-BR');
// Caminho da arvore: destaca a folha, que e onde o anuncio de fato vai parar.
const caminho=c=>{
  if(!c) return '';
  const p=String(c).split(' > ');
  const fim=p.pop();
  return (p.length?esc(p.join(' › '))+' › ':'')+`<span class="fim">${esc(fim)}</span>`;
};
const DM=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit'});
const dm=s=>{ if(!s) return ''; const d=new Date(s+'T12:00:00'); return isNaN(d)?s:DM.format(d); };
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;

// A cor da taxa e RELATIVA a media da propria conta — nao existe numero
// absoluto certo: 5% pode ser otimo numa categoria e pessimo em outra, porque
// o ML divide pela media dos concorrentes, que ele nao publica.
// Devolve o NOME do status (good/warn/crit); a cor mora no CSS.
let MEDIA=0, C_AVISO=null;   // aviso da conta (ML sem resposta), mostrado no status
const cs=t=>t==null?'neu':(t>=2*MEDIA&&t>0)?'crit':t>MEDIA?'warn':'good';
const TRAD={not_working_item:'Produto não funciona',broken_item:'Produto quebrado',
 missing_item:'Faltou o produto',missing_accessories:'Faltou acessório',empty_box:'Caixa vazia',
 different_than_published:'Diferente do anúncio',different_color_or_size:'Cor, tamanho ou modelo errado',
 different_item_other:'Veio outro produto',different_item_other_change:'Veio outro produto',
 damaged_package_broken_item:'Embalagem danificada, produto quebrado',
 damaged_package_not_working_item:'Embalagem danificada, não funciona',
 damaged_package_missing_accessories:'Embalagem danificada, faltou peça',
 undelivered_repentant_buyer:'Desistiu antes de receber',undelivered_other:'Não entregue',
 delivered_but_not_receive_package:'Diz que não recebeu',out_of_stock:'Você ficou sem estoque',
 estimated_delivery_out_of_time:'Demorou demais para entregar',
 delivery_date_was_not_met:'Prazo de entrega não cumprido',
 change_receiver_address:'Endereço errado',unauthorized_purchase:'Compra não autorizada',
 shipment_problem_other:'Problema no envio',unprinted_label:'Etiqueta não imprimiu',
 unavailable_product_other:'Produto indisponível',repentant_buyer:'Arrependimento',
 missing_invoice:'Nota fiscal não chegou',fake_different:'Não é da marca original / falso',
 damaged_package_empty_box:'Embalagem danificada, caixa vazia',damaged_package_missing_item:'Embalagem danificada, faltou o produto',
 broken_item_fashion:'Produto quebrado',defective_item_change:'Defeito, quer trocar',
 item_not_useful_fashion_different_change:'Chegou bem, quer trocar',different_color_or_size_fashion:'Cor, tamanho ou modelo errado',
 bigger_than_expected_fashion:'Maior do que esperava',missing_accessories_change:'Faltou acessório, quer trocar'};
// motivo que o ML criar depois: mostra legivel (sem sublinhado), nunca o codigo cru
const motivo=n=>TRAD[n]||(n?String(n).replace(/_/g,' '):'');

function info(i){
  const c=D.categorias.find(x=>x.id===i.categoria)||{};
  const jan=i.janela||365;
  // as reclamacoes que estao DENTRO da base desta nota (60, 180 ou 365 dias)
  // a lista traz TODAS as de produto; `conta` diz se entra na conta. A que o vendedor
  // ganhou ou o ML cobriu fica na lista com selo, fora da conta (medido: nao pesa).
  // As que contam vem primeiro, na ordem em que saem da janela.
  const rec=(D.reclamacoes||[]).filter(x=> i.ramo==='HERDA'
      ? (x.categoria===i.categoria && x.dias<=jan)
      : (i.ramo==='ITEM'||i.ramo==='ANTIGO') ? (x.item===i.id && x.dias<=jan) : false)
    .map(x=>({...x, sai: jan-x.dias}))
    .sort((a,b)=>(b.conta?1:0)-(a.conta?1:0) || a.sai-b.sai);
  const recContam=rec.filter(x=>x.conta);
  // as do PROPRIO anuncio no ano: sao elas que derrubam so ele (medido: 98% dos
  // pares na mesma categoria), e pesam forte por `peso` dias
  const peso=R().PESO;
  const todas=(D.reclamacoes||[]).filter(x=>x.item===i.id && x.dias<=R().JANELA).sort((a,b)=>a.dias-b.dias);
  const minhas=todas.filter(x=>x.conta);
  const favor=todas.length-minhas.length;
  const pesam=minhas.filter(x=>x.dias<=peso).length;
  const base = i.ramo==='ITEM' ? {qual:'o próprio anúncio', jan:jan+' dias'}
             : i.ramo==='HERDA'? {qual:'a categoria '+(i.cat_nome||''), jan:R().JANELA+' dias'}
             : i.ramo==='ANTIGO'? {qual:'o cálculo antigo', jan:R().JANELA_ANTIGA+' dias'}
             : {qual:null, jan:null};
  base.v=i.base_vendas; base.t=i.taxa;
  return {c:c, rec:rec, recContam:recContam, base:base, minhas:minhas, todas:todas, favor:favor, pesam:pesam, peso:peso};
}

// A SITUACAO VEM PRONTA DO COLETOR (regras.py) — a tela nao classifica nada.
// A legenda e a lista FIXA de casos, sempre inteira, com a contagem do recorte:
// identica em qualquer conta, e um caso com zero continua sendo verdade.
function situacaoDe(i){ return i.situacao || ['','ok']; }
function situacao(i){
  const [cls,txt]=situacaoDe(i);
  return `<span class="st ${cls}">${esc(txt)}</span>`;
}
function legendaSituacao(l){
  const n=new Map();
  l.forEach(function(i){ const t=situacaoDe(i)[1]; n.set(t,(n.get(t)||0)+1); });
  return (D.casos||[]).map(function(c){
    return `<div class="lr"><span class="st ${c[0]}">${esc(c[1])}</span>`
      +`<em>${esc(c[2])}</em><i class="ct2">${mil(n.get(c[1])||0)}</i></div>`; }).join('');
}

function linha(i){
  const ab = aberto===i.id;
  return `<tr class="ln ${ab?'ab':''}" data-id="${i.id}">
    <td><div class="it">
      <button type="button" class="exp" aria-expanded="${ab}" aria-controls="det-${i.id}"
        aria-label="${ab?'Fechar':'Abrir'} detalhes de ${esc(i.titulo)}">▸</button>
      ${i.thumb?`<img class="thumb" src="${esc(i.thumb)}" width="36" height="36" alt="" loading="lazy">`:'<div class="thumb"></div>'}
      <div class="tt"><b title="${esc(i.titulo)}">${esc(i.titulo)}</b>
      <code translate="no">${i.id}</code> · <code>${esc(i.cat_nome)}</code></div></div></td>
    <td><span class="b ${nb(i.nota)}">${nt(i.nota)}</span></td>
    <td>${i.ramo==='ITEM'?`<span class="tag neu plain">${esc(T('base_anuncio'))}</span>`
        :i.ramo==='HERDA'?`<span class="tag acc plain">${esc(T('base_categoria'))}</span>`
        :i.ramo==='ANTIGO'?`<span class="tag neu plain">${esc(T('base_antigo'))}</span>`:`<span class="tag neu plain">${esc(T('base_nenhuma'))}</span>`}</td>
    <td class="num">${mil(i.v365)}</td>
    <td class="num muted">${mil(i.v60)}</td>
    <td class="num">${i.reclamacoes||'<span class="muted">0</span>'}</td>
    <td class="num"><span class="tx">${i.taxa==null?'':`<i class="dot ${cs(i.taxa)}" aria-hidden="true"></i>`}${pc(i.taxa)}</span></td>
    <td>${situacao(i)}</td></tr>
    ${ab?`<tr id="det-${i.id}"><td class="det" colspan="8">${detalhe(i)}</td></tr>`:''}`;
}

// Quanto tempo sem vender, SEM mentir sobre a idade: a janela de pedidos e de
// 365 dias, entao "ha mais de um ano" so vale para anuncio com mais de um ano.
function semVenda(i, peso){
  if(i.dias_sem_venda!=null) return i.dias_sem_venda>peso ? `não vende há ${i.dias_sem_venda} dias` : null;
  if(i.idade!=null && i.idade<R().JANELA) return `nunca vendeu desde que foi criado, há ${i.idade} dias`;
  if(i.idade==null) return `não vende há pelo menos ${R().JANELA} dias`;
  return 'não vende há mais de um ano';
}
// UMA frase dizendo o que esta segurando a nota — e o que muda isso.
function acao(i,o){
  const minhas=o.minhas, pesam=o.pesam, peso=o.peso, favor=o.favor;
  const parada = semVenda(i, peso);
  const soVendendo = parada ? ` Este anúncio <b>${parada}</b> — o Mercado Livre só refaz a nota quando ele vender.` : '';
  const pl=n=>n>1?'reclamações':'reclamação';
  // fechada a seu favor / o ML cobriu: existe, mas nao pesa (medido) — dita, nao escondida
  const semPeso = !favor ? '' : favor===1
    ? ' <b>Uma</b> reclamação deste anúncio foi fechada a seu favor ou coberta pelo Mercado Livre e não conta.'
    : ` Outras <b>${favor}</b> reclamações deste anúncio foram fechadas a seu favor ou cobertas pelo Mercado Livre e não contam.`;
  if(i.freeze) return ['good','Programa Decola: a nota continua, mas a punição está anulada enquanto o programa durar.'];
  if(i.nota==null||i.nota===-1){
    if(i.ramo==='ANTIGO') return ['good',`Cinza no cálculo antigo: sem vendas nos últimos ${R().JANELA_ANTIGA} dias. Cinza não tira exposição.`];
    if(i.sem_nota) return ['acc',`Pela regra este anúncio já teria nota (${i.ramo==='ITEM'?`passou de ${R().LIM_ITEM} vendas`:`a categoria passou de ${R().LIM_CAT}`}) — o Mercado Livre ainda não calculou. Enquanto está cinza <b>não perde exposição</b>.`];
    return ['good',`Sem nota porque a categoria ainda não chegou a ${R().LIM_CAT} vendas no ano — e sem nota o Mercado Livre não tira exposição.`];
  }
  const daBase = i.ramo==='HERDA'
    ? `a categoria: <b>${i.reclamacoes}</b> ${pl(i.reclamacoes)} em <b>${mil(i.base_vendas)}</b> vendas suas lá`
    : i.base_vendas
    ? `o histórico do próprio anúncio: <b>${i.reclamacoes}</b> ${pl(i.reclamacoes)} em <b>${mil(i.base_vendas)}</b> vendas`
    : `algo que o painel não consegue conferir — o anúncio não chegou a ${R().LIM_ITEM} vendas e a categoria não chegou a ${R().LIM_CAT} no ano; vale o texto do Mercado Livre acima`;
  // cancelamento feito por VOCE conta na nota (oficial e citado pelo ML); medido em 4 contas,
  // nunca derrubou um anuncio sozinho — entra como fator, nao como veredito
  const canc = i.cancelamentos ? ` Você também cancelou <b>${i.cancelamentos}</b> venda${i.cancelamentos>1?'s':''} dele no ano — o Mercado Livre conta cancelamento feito pelo vendedor.` : '';
  if(i.ruim){
    if(pesam) return ['crit',`<b>${pesam} ${pl(pesam)} neste anúncio ainda pesa${pesam>1?'m':''}</b> — reclamação pesa forte por ${peso} dias e depois vai perdendo peso. A mais nova deixa de pesar em <b>${peso-minhas[0].dias} dias</b>.${canc}${semPeso}${soVendendo}`];
    if(minhas.length) return ['warn',`${minhas.length===1?'A única reclamação deste anúncio já passou':`As ${minhas.length} reclamações deste anúncio já passaram`} de ${peso} dias e pesa${minhas.length===1?'':'m'} pouco. O que segura a nota é ${daBase}.${semPeso}${soVendendo}`];
    return ['warn',`Nenhuma reclamação${favor?' que conte':''} neste anúncio no ano. O que segura a nota é ${daBase}.${canc}${semPeso}${soVendendo}`];
  }
  if(i.nota===75){
    if(pesam) return ['warn',`75 não tira exposição, mas ${pesam} ${pl(pesam)} neste anúncio ainda pesa${pesam>1?'m':''}. Sem reclamação nova, tende a voltar a 100 depois de ${peso} dias${parada?' — quando vender':''}.${semPeso}`];
    return ['good',`75 não tira exposição.${minhas.length?(minhas.length===1?` A reclamação deste anúncio já passou de ${peso} dias.`:` As reclamações deste anúncio já passaram de ${peso} dias.`):''}${semPeso}${soVendendo}`];
  }
  return ['good', (minhas.length?`Nota 100. ${minhas.length} ${pl(minhas.length)} no ano não derrubaram a nota.`:`Nota 100, nenhuma reclamação${favor?' que conte':''} neste anúncio no ano.`)+semPeso];
}

function detalhe(i){
  const o=info(i), c=o.c, rec=o.rec, recContam=o.recContam, base=o.base, minhas=o.minhas, favor=o.favor, pesam=o.pesam, peso=o.peso;
  let n=recContam.length;
  const proj=recContam.map(r=>{n--;return {d:r.sai,t:base.v?100*n/base.v:null}});
  const g=(i.ramo==='HERDA'?i.grupos_cat:i.grupos)||{};
  const fora=(g.ARREPENDIMENTO||0)+(g.ENTREGA||0);
  const A=acao(i,o);

function cartaoConta(C){
  const eu=$('#eu'); if(!eu) return;
  if(!C||!C.ligado){ eu.innerHTML=''; return; }
  const ini=(C.nick||'?').slice(0,2).toUpperCase();
  eu.innerHTML=`<button type="button" class="pill light eu" id="euc" aria-haspopup="menu" aria-expanded="false">
    ${C.foto?`<img src="${esc(C.foto)}" width="34" height="34" alt="">`:`<span class="ini" aria-hidden="true">${esc(ini)}</span>`}
    <span class="qn"><b>${esc(C.nick||'')}</b><span>${esc((C.nome||'').slice(0,26))}</span></span>
    <i class="cv" aria-hidden="true">▾</i>
  </button>`;
  const cx=eu.querySelector('#euc');
  const fecha=()=>{const m=eu.querySelector('.menu'); if(m) m.remove(); cx.setAttribute('aria-expanded','false');};
  cx.onclick=e=>{
    e.stopPropagation();
    if(eu.querySelector('.menu')){ fecha(); return; }
    cx.setAttribute('aria-expanded','true');
    const m=document.createElement('div'); m.className='menu'; m.setAttribute('role','menu');
    m.innerHTML=`<button type="button" role="menuitem" id="bsair">${esc(T('btn_sair'))}</button>`;
    eu.appendChild(m);
    m.onclick=e=>e.stopPropagation();
    const b=m.querySelector('#bsair'); b.focus();
    b.onclick=async()=>{
      if(!confirm('Desconectar '+(C.nick||'')+'?\n\nO painel volta do zero.')) return;
      await fetch('/api/sair',{method:'POST',headers:{'Content-Type':'application/json'},
                               body:JSON.stringify({tudo:true})});
      carrega(false);
    };
  };
  eu._fecha=fecha;
}
document.addEventListener('click',()=>{const eu=$('#eu'); if(eu&&eu._fecha) eu._fecha();});

// Uma gemea SERVE de destino se responde bem as duas perguntas:
//   1. tem experiencia de compra ruim la?  -> nota 30 ou 65 em qualquer anuncio seu
//   2. o ML vai remanejar o anuncio de la? -> mesmo dominio ja garante. (Medido na
//      conta de referencia: 1 remanejo em 369 anuncios num ano, e esse trocou de
//      dominio; nenhum anuncio dentro do dominio certo foi mexido.)
// Tres formas de servir: contador ZERADO, contador BAIXO (as duas ainda nao
// chegaram nas 200 do ano, entao a categoria nao manda nota — fica cinza) ou
// nota BOA JA COMPROVADA (passou das 200, manda nota, e a nota que manda e 75/100).
// Categoria AFETADA = ja esta dando nota que tira exposicao (30 ou 65) em pelo
// menos um anuncio seu. E o unico caso em que ha decisao a tomar.
const afetada=c=>Object.entries(c.notas||{}).some(([k,n])=>(k==='30'||k==='50'||k==='65')&&n>0);

function destino(x){
  const alvo=D.categorias.find(y=>y.id===x.id);
  const notas=Object.entries((alvo&&alvo.notas)||{})
    .filter(([k])=>k!=='null'&&k!=='-1');
  const ruins=notas.filter(([k])=>k==='30'||k==='50'||k==='65').reduce((a,[,n])=>a+n,0);
  if(ruins)
    return {...x, serve:false};                 // ja pune la: nunca e saida
  if(!x.vendas365)
    return {...x, serve:true, classe:'livre', selo:T('selo_zerado')};
  if(!x.acima_limiar)                           // vende la, mas longe das 200: ainda nao da nota
    return {...x, serve:true, classe:'livre', selo:`${T('selo_baixo')} · ${mil(x.vendas365)} de ${R().LIM_CAT}`};
  if(!notas.length)
    return {...x, serve:false};                 // passou das 200 e nao sei a nota: nao arrisco
  // ⚠️ o contador do map NAO pode se chamar `v`: ja atropelou a nota uma vez.
  return {...x, serve:true, classe:'boa', selo:T('selo_boa'),
          resumo:notas.sort((a,b)=>b[0]-a[0]).map(([k,n])=>k+'×'+n).join(' ')};
}

function tabela(){
  const q=busca.trim().toLowerCase();
  let l=D.itens.filter(function(i){
    if(filtro==='punidos'&&!i.ruim) return false;
    if(filtro==='semnota'&&!i.sem_nota) return false;
    if(q&&!((i.titulo||'').toLowerCase().includes(q)||i.id.toLowerCase().includes(q)
       ||(i.cat_nome||'').toLowerCase().includes(q))) return false;
    return true});
  l.sort(function(a,b){return (b.pune-a.pune)||(b.dormente-a.dormente)
    ||((a.nota==null?999:a.nota)-(b.nota==null?999:b.nota))||(b.v365-a.v365)});
  // sem teto: a lista mostra TODOS os anuncios do recorte. O custo de render
  // fica sob controle por `content-visibility:auto` nas linhas (ver CSS), que
  // pula o layout das que estao fora da tela sem precisar de biblioteca.
  $('#tb').innerHTML=l.map(linha).join('')
    ||('<tr><td colspan="8" class="vazio">'+esc(D.itens.length?T('vazio_filtro'):T('vazio_conta'))+'</td></tr>');
  const alterna=(id,foco)=>{
    aberto = aberto===id ? null : id; tabela();
    if(foco){ const b=document.querySelector(`tr.ln[data-id="${id}"] .exp`); if(b) b.focus(); }
  };
  document.querySelectorAll('tr.ln').forEach(function(tr){
    tr.onclick=function(e){ if(e.target.closest('a,button')) return; alterna(tr.dataset.id,false); };
    tr.querySelector('.exp').onclick=function(e){ e.stopPropagation(); alterna(tr.dataset.id,true); };
  });
}

function telaLogin(C, erro){
  topo(C && C.ligado);
  const passo = C.tem_app ? 2 : 1;   // so existem dois; conectar ja sai desta tela
  $('#sub').textContent = '';
  $('#kpis').innerHTML = '';

    <h2>${esc(T('con_titulo'))}</h2>
    <div class="sub2">O token fica só neste computador, no arquivo <code>conta.json</code>
      — nada é enviado para lugar nenhum.${C.pacote?` <span class="muted">Painel v${esc(C.pacote)}.</span>`:''}</div>

    <div class="passo2 ${passo>1?'feito':''}" id="p1">
      <span class="n2">.01</span><h3>${esc(T('con_p1'))}</h3>
      ${passo>1?`<button type="button" class="reabrir" id="p1edit">\u2713 salvo \u2014 alterar</button>`:''}
      <div class="campo"><label for="fa">App ID</label>
        <input id="fa" name="app_id" inputmode="numeric" autocomplete="off" spellcheck="false"
          value="${esc(C.app_id||'')}" placeholder="1234567890123456">
        <a class="onde" href="https://developers.mercadolivre.com.br/devcenter"
           target="_blank" rel="noopener">Onde acho? Abrir minhas aplicações ↗</a></div>
      <div class="campo"><label for="fs">Chave secreta (Client Secret)</label>
        <input id="fs" name="secret" type="password" autocomplete="off"
          placeholder="${C.tem_app?'••••••••  (já salva, preencha só para trocar)':'A chave do seu app'}">
        <a class="onde" id="lchave" href="https://developers.mercadolivre.com.br/devcenter"
           target="_blank" rel="noopener">Abrir a página da minha chave ↗</a></div>
      <div class="campo"><label for="fr">URI de redirect — igual à que você cadastrou</label>
        <input id="fr" name="redirect" type="url" autocomplete="off" spellcheck="false"
          value="${esc(C.redirect||'https://httpbin.org/get')}">
        <a class="onde" id="lredir" href="https://developers.mercadolivre.com.br/devcenter"
           target="_blank" rel="noopener">Abrir onde cadastrei o redirect ↗</a>
        <span class="dica">na página que abrir, clique em <b>Continuar</b> — o campo fica logo abaixo</span></div>
      <div class="campo"><button type="button" class="pill dark" id="bapp">${esc(T('btn_salvar'))} <span class="arr" aria-hidden="true">→</span></button></div>
    </div>

    <div class="passo2 ${passo<2?'off':''}">
      <span class="n2">.02</span><h3>${esc(T('con_p2'))}</h3>
      <div class="ajuda">
        ${C.url?`<a class="lk" href="${esc(C.url)}" target="_blank" rel="noopener"><b>Abrir a autorização no Mercado Livre ↗</b></a><br>`
               :'Salve o passo 1 para liberar o link.<br>'}
        Depois de autorizar, o navegador abre uma página que mostra o seu código.
        Copie <b>de <code>TG-</code> em diante, sem as aspas</b> — por exemplo
        <code>TG-68c1a4…-123456789</code>. Se preferir, pode colar a URL inteira da barra de
        endereços: o painel acha o código dos dois jeitos.</div>
      <div class="campo"><label for="fc">Cole aqui o código (de <code>TG-</code> em diante)</label>
        <input id="fc" name="codigo" autocomplete="off" spellcheck="false"
          placeholder="TG-68c1a4…-123456789"></div>
      <div class="campo"><button type="button" class="pill dark" id="bcod">${esc(T('btn_conectar'))} <span class="arr" aria-hidden="true">→</span></button></div>
      ${erro?`<div class="erro" role="alert">${esc(erro)}</div>`:''}
    </div>

    </div>
  </div>`;

  // Com o App ID em maos da para abrir DIRETO a pagina do aplicativo — a chave e o
  // redirect moram os dois la (o redirect so aparece depois do botao Continuar).
  const LISTA='https://developers.mercadolivre.com.br/devcenter';
  const lig=()=>{
    const id=($('#fa').value||'').replace(/\D/g,'');
    const bom=id.length>=10, url=bom?LISTA+'/edit-app/'+id:LISTA;
    [['#lchave','Abrir a p\u00e1gina da minha chave \u2197','Preencha o App ID para abrir a p\u00e1gina da chave'],
     ['#lredir','Abrir onde cadastrei o redirect \u2197','Preencha o App ID para abrir essa p\u00e1gina']]
    .forEach(function(e){
      const a=$(e[0]); if(!a) return;
      a.href=url; a.textContent = bom?e[1]:e[2]; a.classList.toggle('morto', !bom);
    });
  };
  $('#fa').addEventListener('input', lig); lig();

  // trancado nao e definitivo: quem digitou errado precisa poder voltar
  const reab = $('#p1edit');
  if(reab) reab.onclick = ()=>{ $('#p1').classList.remove('feito'); reab.remove(); $('#fa').focus(); };

  // ⚠️ Botao que vira "Conectando…" TEM de voltar em TODOS os caminhos. Antes,
  // se o fetch estourasse (servidor reiniciando, rede caindo), o await rejeitava,
  // o codigo abaixo nunca rodava e o botao ficava travado para sempre, calado.
  const trava = (b, txt) => { const antes = b.innerHTML; b.textContent = txt; b.disabled = true;
    return () => { b.innerHTML = antes; b.disabled = false; }; };
  const avisa = (passo, msg) => {
    const cx = document.querySelectorAll('.passo2')[passo];
    let e = cx.querySelector('.erro');
    if(!e){ e = document.createElement('div'); e.className = 'erro'; e.setAttribute('role','alert'); cx.appendChild(e); }
    e.textContent = msg;
  };
  const manda = async (rota, corpo) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 45000);      // teto: nunca pendura
    try { const resp = await fetch(rota, {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify(corpo), signal: ctrl.signal});
          return await resp.json(); }
    finally { clearTimeout(t); }
  };

  $('#bapp').onclick = async ()=>{
    const solta = trava($('#bapp'), 'Salvando…');
    try{
      const r = await manda('/api/app', {app_id:$('#fa').value, secret:$('#fs').value, redirect:$('#fr').value});
      if(r.erro){ solta(); return avisa(0, r.erro); }
      telaLogin(r);
    }catch(e){
      solta();
      avisa(0, e.name==='AbortError' ? 'Demorou demais. O painel está rodando?'
            : 'Não consegui falar com o painel. Ele está aberto nesta máquina?');
    }
  };

  $('#bcod').onclick = async ()=>{
    const solta = trava($('#bcod'), 'Conectando…');
    try{
      const r = await manda('/api/codigo', {codigo:$('#fc').value});
      if(r.ligado) return carrega(false);
      solta();
      avisa(1, r.erro || 'Não consegui trocar o código. Confira se a URI de redirect é exatamente a mesma cadastrada no app — e lembre que o código vale poucos minutos: se demorou, gere outro.');
    }catch(e){
      solta();
      avisa(1, e.name==='AbortError' ? 'Demorou demais. Gere um código novo e tente de novo.'
            : 'Não consegui falar com o painel. Ele está aberto nesta máquina?');
    }
  };
}

// A TELA CONFERE ANTES DE MOSTRAR. O coletor ja conferiu (regras.checar) e gravou
// o veredito em D.conferencia; a tela repete o essencial por conta propria — versao,
// casos, situacao de cada anuncio, taxa, cards = chips. Qualquer falha: nenhum card,
// so a lista do que falhou e o botao de coletar de novo. Errado nao se mostra.
function conferir(D){
  const p=[];
  if(D.conferencia && !D.conferencia.ok){
    (D.conferencia.falhas||[]).forEach(f=>p.push('regra: '+f));
    (D.conferencia.desconhecidos||[]).forEach(f=>p.push('o painel não conhece: '+f));
    (D.conferencia.leitura||[]).forEach(f=>p.push('leitura incompleta: '+f));
  }
  const casos=new Set((D.casos||[]).map(c=>c[0]));
  if(!casos.size) p.push('lista de casos da Situação ausente');
  if(!D.rotulos) p.push('textos fixos da tela ausentes');
  let forte=0,punido=0,semnota=0,decola=0,pune=0,dorm=0,sn=0,frz=0;
  for(const i of D.itens||[]){
    const s=i.situacao;
    if(!s||!casos.has(s[0])){ p.push(i.id+': situação fora da lista'); continue; }
    if(s[0]==='forte') forte++; else if(s[0]==='punido') punido++;
    else if(s[0]==='semnota') semnota++; else if(s[0]==='decola') decola++;
    if(i.pune) pune++; if(i.dormente) dorm++; if(i.sem_nota) sn++; if(i.freeze) frz++;
    if(i.base_vendas && Math.abs((i.taxa||0)-100*i.reclamacoes/i.base_vendas)>1e-6) p.push(i.id+': taxa não bate com reclamações ÷ vendas');
  }
  const lst=D.reclamacoes||[];
  if(D.total_conta!==lst.filter(r=>r.conta).length) p.push('total de reclamações que contam ≠ lista');
  if(pune+dorm!==forte+punido) p.push(`card "perdendo exposição" (${pune+dorm}) ≠ chips preto + vinho (${forte+punido})`);
  if(sn!==semnota) p.push(`card "sem nota ainda" (${sn}) ≠ chips (${semnota})`);
  if(frz!==decola) p.push(`Decola (${frz}) ≠ chips (${decola})`);
  return p;
}

  $('#app').innerHTML=`<div class="vazio">
    <div class="ei ruim" aria-hidden="true">!</div>
    <h2>${esc(T('bloqueio_titulo'))}</h2>
    <p>Antes de mostrar qualquer número, o painel confere os dados contra as regras.
      Desta vez ${p.length===1?'uma conferência falhou':p.length+' conferências falharam'} — então ele
      não mostra nada, para não mostrar errado.</p>
    <ul class="falhas">${p.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}${p.length>12?`<li>… e mais ${p.length-12}</li>`:''}</ul>
    <p><button type="button" class="pill dark" id="denovo">${esc(T('btn_denovo'))} <span class="arr" aria-hidden="true">→</span></button></p>
    <p class="muted sm">Se falhar de novo, mande o texto acima e a versão (painel v${esc(D.pacote||'?')}) para quem te passou o painel.</p>
  </div>`;
  $('#denovo').onclick=function(){ carrega(true); };
}

// Os dois botoes do topo sao exclusivos: desconectado so faz sentido o guia,
// conectado so faz sentido atualizar. Nunca os dois juntos.
function topo(ligado){
  $('#bguia').hidden = !!ligado;
  $('#att').hidden   = !ligado;
}

// `reparo` conta as coletas automaticas desta carga de pagina: a tela tenta se
// consertar UMA vez (coleta de novo) antes de bloquear. Clicar em Atualizar zera.
let reparo=0;
async function carrega(f, automatico){
  if(!automatico) reparo=0;
  const C = await (await fetch('/api/conta')).json();
  C_ROTULOS = C.rotulos || C_ROTULOS;
  $('#bguia').textContent = T('btn_guia');
  $('#att').innerHTML = esc(T('btn_atualizar'))+' <span class="arr" aria-hidden="true">→</span>';
  C_AVISO = C.aviso || null;
  topo(C.ligado);
  // ATUALIZACAO AUTOMATICA DO PAINEL: o servidor confere o repositorio publico (atualizador.py);
  // se ha versao nova, a tela pede a troca, espera o servidor voltar e recarrega. Uma tentativa
  // por versao nesta aba — se der errado, segue na versao atual e diz o motivo.
  const A = C.atualizacao || {};
  if(A.disponivel && A.versao && A.versao!==C.pacote && !lembra('att_'+A.versao)){
    lembra('att_'+A.versao, '1');
    const st0=$('#status'); st0.classList.remove('falha');
    st0.textContent='Atualizando o painel para a versão '+A.versao+'…';
    let r={};
    try{ const ctrl=new AbortController(); const tt=setTimeout(()=>ctrl.abort(),60000);
      r=await(await fetch('/api/atualizar_painel',{method:'POST',signal:ctrl.signal})).json(); clearTimeout(tt); }
    catch(e){ r={erro:'não consegui falar com o painel'}; }
    if(r.ok){
      st0.textContent='Painel atualizado para a versão '+A.versao+' — reiniciando…';
      for(let k=0;k<90;k++){ await new Promise(z=>setTimeout(z,1000));
        try{ const c2=await(await fetch('/api/conta')).json(); if(c2.pacote===A.versao){ location.reload(); return; } }catch(e){} }
      st0.textContent='⚠ o painel foi atualizado, mas o servidor não voltou — feche e abra de novo com ligar.py'; st0.classList.add('falha'); return;
    }
    st0.textContent='⚠ não consegui atualizar o painel: '+(r.erro||'?')+' — seguindo na versão '+(C.pacote||''); st0.classList.add('falha');
  }
  if(!C.ligado) return telaLogin(C);
  const main=$('#app'), st=$('#status'), att=$('#att');
  if(f){
    // refetch mantem a tela anterior a meia opacidade — sem esqueleto, sem pulo
    main.classList.add('carregando'); att.disabled=true; st.classList.remove('falha');
    st.textContent='Lendo o Mercado Livre…';
    let fim=false;   // uma leitura do progresso lancada antes do fim chegava depois e cobria o resultado
    const t=setInterval(async function(){try{const p=await(await fetch('/api/progresso')).json();
      if(p.msg&&!fim) st.textContent=p.msg.replace(/[.…]+$/,'')+'…'}catch(e){}},900);
    // ⚠️ a coleta podia falhar e a tela apagava a mensagem: falha silenciosa,
    // o vendedor achava que atualizou. E se o fetch estourasse o botao nunca
    // voltava. Agora o erro fica na tela e o botao destrava sempre.
    let r={};
    try{ r=await(await fetch('/api/coletar',{method:'POST'})).json(); }
    catch(e){ r={erro:'não consegui falar com o painel — ele está aberto nesta máquina?'}; }
    fim=true; clearInterval(t);
    main.classList.remove('carregando'); att.disabled=false;
    st.textContent = r.erro ? ('⚠ a atualização falhou: '+r.erro) : '';
    st.classList.toggle('falha', !!r.erro);
  }
  cartaoConta(C);
  D=await(await fetch('/api/dados')).json();
  // AUTO-CONSERTO: sem dados, formato velho ou conferencia reprovada -> coleta de
  // novo sozinho, uma vez. So depois disso a tela bloqueia e pede ajuda.
  const precisa = D.vazio ? 'primeira leitura da conta'
                : (D.versao!==undefined && D.versao!==VERSAO_DADOS) ? 'dados de uma versão anterior'
                : null;
  const prob = precisa ? [] : conferir(D);
  if(precisa || prob.length){
    if(reparo<1 && !(f && !precisa && prob.length===0)){
      reparo++;
      st.textContent = (precisa || ('a conferência reprovou os dados ('+prob.length+') — refazendo'))+'…';
      return carrega(true, true);
    }
    if(precisa){
      $('#kpis').innerHTML='';
      $('#app').innerHTML='<div class="vazio">'+(D.vazio?esc(T('vazio_dados')):'Os dados salvos são de uma versão anterior do painel.')
        +' Clique em <b>'+esc(T('btn_atualizar'))+'</b>.</div>';
      return;
    }
    bloqueia(prob); return;
  }
  pinta();
  if(D.avisos&&D.avisos.length&&!st.textContent){
    st.textContent='⚠ '+D.avisos.join(' · '); st.classList.add('falha');
  }
}
$('#att').onclick=function(){carrega(true)};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const eu=$('#eu'); if(eu&&eu.querySelector('.menu')){ eu._fecha(); $('#euc').focus(); return; }
  if(aberto){ const id=aberto; aberto=null; tabela();
    const b=document.querySelector(`tr.ln[data-id="${id}"] .exp`); if(b) b.focus(); }
});
carrega(false);
</script>
</body>
